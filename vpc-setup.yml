- hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Import VPC Variables
      include_vars: vars/vpc_setup

    - name: create VprofileVPC
      ec2_vpc_net:
        name: "{{ vpc_name }}"
        cidr_block: "{{ vpcCidr }}"
        region: "{{ region }}"
        dns_support: yes
        dns_hostnames: yes
        tenancy: default
        state: "{{ state }}"
      register: vpcout
    - debug:
        var: vpcout

    - name: Create Public Subnet 1 in Zone 1
      ec2_vpc_subnet:
        region: "{{region}}"
        az: "{{zone1}}"
        state: "{{state}}"
        cidr: "{{PubSub1Cidr}}"
        vpc_id: "{{vpcout.vpc.id}}"
        map_public: yes
        resource_tags:
          name: vprofile_pubsub1
      register: pubsub1_out

        

    