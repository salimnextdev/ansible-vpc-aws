- hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Import VPC Variables
      include_vars: vars/vpc_setup

    - name: create VprofileVPC
      ec2_vpc_net:
        name: "{{ vpc_name }}"
        cidr_block: "{{ vpcCidr }}"
        region: "{{ region }}"
        dns_support: yes
        dns_hostnames: yes
        tenancy: default
        state: "{{ state }}"
      register: vpcout

    - name: Create Public Subnet 1 in Zone 1
      ec2_vpc_subnet:
        region: "{{ region }}"
        az: "{{ zone1 }}"
        state: "{{ state }}"
        cidr: "{{ PubSub1Cidr }}"
        vpc_id: "{{ vpcout.vpc.id }}"
        map_public: yes
        tags:
          Name: vprofile_pubsub1
      register: pubsub1_out

    - name: Create Public Subnet 2 in Zone 2
      ec2_vpc_subnet:
        region: "{{ region }}"
        az: "{{ zone2 }}"
        state: "{{ state }}"
        cidr: "{{ PubSub2Cidr }}"
        vpc_id: "{{ vpcout.vpc.id }}"
        map_public: yes
        tags:
          Name: vprofile_pubsub2
      register: pubsub2_out

    - name: Create Public Subnet 3 in Zone 3
      ec2_vpc_subnet:
        region: "{{ region }}"
        az: "{{ zone3 }}"
        state: "{{ state }}"
        cidr: "{{ PubSub3Cidr }}"
        vpc_id: "{{ vpcout.vpc.id }}"
        map_public: yes
        tags:
          Name: vprofile_pubsub3
      register: pubsub3_out

    - name: Create Private Subnet 1 in Zone 1
      ec2_vpc_subnet:
        region: "{{ region }}"
        az: "{{ zone1 }}"
        state: "{{ state }}"
        cidr: "{{ PrivSub1Cidr }}"
        vpc_id: "{{ vpcout.vpc.id }}"
        tags:
          Name: vprofile_privsub1
      register: privsub1_out

    - name: Create Private Subnet 2 in Zone 2
      ec2_vpc_subnet:
        region: "{{ region }}"
        az: "{{ zone2 }}"
        state: "{{ state }}"
        cidr: "{{ PrivSub2Cidr }}"
        vpc_id: "{{ vpcout.vpc.id }}"
        tags:
          Name: vprofile_privsub2
      register: privsub2_out

    - name: Create Private Subnet 3 in Zone 3
      ec2_vpc_subnet:
        region: "{{ region }}"
        az: "{{ zone3 }}"
        state: "{{ state }}"
        cidr: "{{ PrivSub3Cidr }}"
        vpc_id: "{{ vpcout.vpc.id }}"
        tags:
          Name: vprofile_privsub3
      register: privsub3_out
    - name: Create Internet Gateway
      ec2_vpc_igw:
        region: "{{region}}"
        state: "{{state}}"
        vpc_id: "{{vpcout.vpc.id}}"
        resource_tags:
          Name: vprofile_IGW
      register: igw_out
